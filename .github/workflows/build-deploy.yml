name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Cloudflare after building
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Cloudflare bundle (OpenNext)
        run: bunx opennextjs-cloudflare build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: open-next
          path: .open-next
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    # Deploy on pushes to main, or on a manual run with "deploy" ticked. Never on PRs.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: open-next
          path: .open-next

      - name: Deploy to Cloudflare
        run: bunx opennextjs-cloudflare deploy

      - name: Sync OPENAI_API_KEY to the Worker
        if: env.OPENAI_API_KEY != ''
        run: printf '%s' "$OPENAI_API_KEY" | bunx wrangler secret put OPENAI_API_KEY
